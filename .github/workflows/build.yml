name: build
on:
  workflow_dispatch:
  workflow_run:
    workflows: [extract]
    types: [completed]
jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }

      - name: project folder dhoondo
        run: |
          if [ -f settings.gradle.kts ]; then D=.
          elif [ -f SlowDNS/settings.gradle.kts ]; then D=SlowDNS
          else echo "settings.gradle.kts nahi mili"; ls -la; exit 1; fi
          if [ "$D" = "." ]; then P="$GITHUB_WORKSPACE"; else P="$GITHUB_WORKSPACE/$D"; fi
          echo "PD=$P" >> $GITHUB_ENV
          mkdir -p "$P/app/src/main/jniLibs/arm64-v8a"
          echo "project = $P"

      - name: dnstt-client
        run: |
          OUT=$PD/app/src/main/jniLibs/arm64-v8a
          for i in 1 2 3; do
            rm -rf $RUNNER_TEMP/dnstt
            git clone https://www.bamsoftware.com/git/dnstt.git $RUNNER_TEMP/dnstt && break
            echo "clone fail, retry $i"; sleep 5
          done
          test -d $RUNNER_TEMP/dnstt/dnstt-client || { echo "dnstt clone nahi hua"; exit 1; }
          cd $RUNNER_TEMP/dnstt/dnstt-client
          # Custom DNS payload size: app env DNSTT_UDP_PAYLOAD se deta hai (EDNS0 requester payload; env na ho to purana 4096)
          cat > payload_env.go <<'GO'
          package main

          import (
          	"os"
          	"strconv"
          )

          func payloadSize() uint16 {
          	v, err := strconv.Atoi(os.Getenv("DNSTT_UDP_PAYLOAD"))
          	if err != nil || v < 512 || v > 4096 {
          		return 4096
          	}
          	return uint16(v)
          }
          GO
          sed -i -E 's/Class:([[:space:]]*)4096/Class:\1payloadSize()/' $(ls *.go | grep -v payload_env.go)
          if grep -q 'payloadSize()' $(ls *.go | grep -v payload_env.go); then
            echo "payload patch lag gaya"; grep -n 'payloadSize()' *.go | head
          else
            echo "WARNING: payload patch match nahi hua - DNS packet size setting asar nahi karegi"
            rm -f payload_env.go
          fi
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -o $OUT/libdnstt.so .
          # Low-load binary: polling dheema (patch match na hua to normal binary hi copy hota hai)
          H0=$(git diff | md5sum)
          sed -i -E 's/initPollDelay([[:space:]]*)=([[:space:]]*)500 \* time\.Millisecond/initPollDelay\1=\2 1 * time.Second/; s/maxPollDelay([[:space:]]*)=([[:space:]]*)10 \* time\.Second/maxPollDelay\1=\2 30 * time.Second/; s/pollLimit([[:space:]]*)=([[:space:]]*)16/pollLimit\1=\2 4/' *.go
          H1=$(git diff | md5sum)
          if [ "$H0" = "$H1" ]; then
            echo "WARNING: polling patch match nahi hua, low-load = normal"
            cp $OUT/libdnstt.so $OUT/libdnstt_low.so
          else
            git diff --stat
            CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -o $OUT/libdnstt_low.so .
          fi
          ls -la $OUT

      - name: hev-socks5-tunnel
        run: |
          # Official tareeqa: alag project, jni/ ke andar clone, phir ndk-build
          NDK=${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}}
          echo "NDK = $NDK"
          test -x "$NDK/ndk-build" || { echo "ndk-build nahi mila"; exit 1; }
          H=$RUNNER_TEMP/hevproj
          mkdir -p $H/jni
          for i in 1 2 3; do
            rm -rf $H/jni/hev-socks5-tunnel
            git clone --recursive https://github.com/heiher/hev-socks5-tunnel $H/jni/hev-socks5-tunnel && break
            echo "clone fail, retry $i"; sleep 5
          done
          echo 'include $(call all-subdir-makefiles)' > $H/jni/Android.mk
          printf 'APP_ABI := arm64-v8a\nAPP_PLATFORM := android-26\nAPP_CFLAGS := -O3 -DPKGNAME=hev/htproxy -DCLSNAME=TProxyService\n' > $H/jni/Application.mk
          cd $H
          "$NDK/ndk-build" -j$(nproc)
          find $H/libs -name '*.so'
          SO=$(find $H/libs -name 'libhev-socks5-tunnel.so' | head -1)
          test -s "$SO" || { echo "libhev-socks5-tunnel.so bana hi nahi"; exit 1; }
          cp "$SO" $PD/app/src/main/jniLibs/arm64-v8a/

      - name: hev JNI jaanch + Java class sync
        run: |
          H=$RUNNER_TEMP/hevproj
          SO=$(find $H/libs -name 'libhev-socks5-tunnel.so' | head -1)
          echo "--- .so ke andar JNI naam ---"
          strings -a "$SO" | grep -E "hev/htproxy|TProxy|\(Ljava/lang/String;I\)V|\(\)\[J" | head -20 || true
          echo "--- JNI_OnLoad wali C file ---"
          grep -rn "JNI_OnLoad\|native_methods\|PKGNAME\|CLSNAME" $H/jni/hev-socks5-tunnel/src/*.c | head -30 || true
          # hev ki asli native-method table se Java class bana do, taaki naam/signature hamesha match ho
          HEVDIR=$H/jni/hev-socks5-tunnel OUTJ=$PD/app/src/main/java/hev/htproxy/TProxyService.java python3 - <<'PY'
          import re, sys, glob, os
          d = os.environ['HEVDIR']; outj = os.environ['OUTJ']
          srcs = [p for p in glob.glob(d + '/src/**/*.c', recursive=True) if 'JNI_OnLoad' in open(p, errors='ignore').read()]
          print('jni src:', srcs)
          if not srcs:
              print('JNI source nahi mila - repo wali Java class hi rahegi'); sys.exit(0)
          t = open(srcs[0], errors='ignore').read()
          ms = re.findall(r'\{\s*"(\w+)"\s*,\s*"(\([^"]*\)[^"]*)"\s*,', t)
          print('native table:', ms)
          names = [m[0] for m in ms]
          if 'TProxyStartService' not in names or 'TProxyStopService' not in names:
              print('table samajh nahi aayi - repo wali Java class hi rahegi'); sys.exit(0)
          prim = {'Z': 'boolean', 'B': 'byte', 'C': 'char', 'S': 'short', 'I': 'int', 'J': 'long', 'F': 'float', 'D': 'double', 'V': 'void'}
          def parse(sig, i):
              dims = 0
              while sig[i] == '[':
                  dims += 1; i += 1
              if sig[i] == 'L':
                  j = sig.index(';', i); cls = sig[i + 1:j].replace('/', '.'); i = j + 1
                  base = 'String' if cls == 'java.lang.String' else ('Object' if cls == 'java.lang.Object' else cls)
              else:
                  base = prim[sig[i]]; i += 1
              return base + '[]' * dims, i
          lines = []
          for n, sig in ms:
              j = 1; ps = []
              while sig[j] != ')':
                  ty, j = parse(sig, j); ps.append(ty)
              ret, _ = parse(sig, j + 1)
              args = ', '.join('%s p%d' % (ty, k) for k, ty in enumerate(ps))
              lines.append('  public static native %s %s(%s);' % (ret, n, args))
          code = 'package hev.htproxy;\npublic class TProxyService {\n  static { System.loadLibrary("hev-socks5-tunnel"); }\n' + '\n'.join(lines) + '\n}\n'
          open(outj, 'w').write(code)
          print(code)
          PY

      - name: jniLibs check (gradle se pehle)
        run: |
          ls -la $PD/app/src/main/jniLibs/arm64-v8a/
          for f in libdnstt.so libdnstt_low.so libhev-socks5-tunnel.so; do
            test -s $PD/app/src/main/jniLibs/arm64-v8a/$f || { echo "$f GAYAB hai"; exit 1; }
          done

      - name: gradle assembleDebug
        run: gradle -p "$PD" assembleDebug --stacktrace

      - name: APK ke andar libs check
        run: |
          APK=$(ls $PD/app/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$APK" | grep "lib/"
          for f in libdnstt.so libdnstt_low.so libhev-socks5-tunnel.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$f" || { echo "APK mein $f nahi hai"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with: { name: MolladDNS-apk, path: "${{ env.PD }}/app/build/outputs/apk/debug/*.apk" }
