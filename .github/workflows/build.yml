name: build
on:
  workflow_dispatch:
  workflow_run:
    workflows: [extract]
    types: [completed]
jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: dnstt-client
        run: |
          git clone https://www.bamsoftware.com/git/dnstt.git
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd dnstt/dnstt-client
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libdnstt.so .
      - name: hev-socks5-tunnel
        run: |
          git clone --recursive https://github.com/heiher/hev-socks5-tunnel
          cd hev-socks5-tunnel
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=arm64-v8a APP_PLATFORM=android-26 NDK_LIBS_OUT=$GITHUB_WORKSPACE/app/src/main/jniLibs "APP_CFLAGS=-O3 -DPKGNAME=hev/htproxy -DCLSNAME=TProxyService"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: MolladDNS-apk, path: app/build/outputs/apk/debug/*.apk }
